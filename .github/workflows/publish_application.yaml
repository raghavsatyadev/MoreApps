name: Build, Sign and Publish Application to Play Store

# Disabled: the Play listing for com.rocky.moreapps.example is gone. Runs only when started by
# hand from the Actions tab; put the release trigger back to publish on each release again.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build, sign and upload the sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release AAB
        run: ./gradlew :sample:androidApp:bundleRelease
      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: sample/androidApp/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASS }}
          keyPassword: ${{ secrets.KEY_PASS }}
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.rocky.moreapps.example
          releaseFiles: sample/androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 5
          whatsNewDirectory: distribution/whatsnew
