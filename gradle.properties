android.builtInKotlin=true
android.enableJetifier=false
android.newDsl=true
android.nonFinalResIds=true
android.nonTransitiveRClass=true
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx4096M -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx3072M" -XX\:+UseParallelGC
org.gradle.parallel=true

# Maven Central (vanniktech plugin). Credentials and the signing key come from the
# ORG_GRADLE_PROJECT_mavenCentralUsername / mavenCentralPassword / signingInMemoryKey* env vars.
